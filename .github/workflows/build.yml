name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer (Docker)
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer -c "echo y | buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ github.workspace }}/bin/*.apk
